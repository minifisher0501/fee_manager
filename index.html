    /* ---- Ported from the original src/index.css ---- */
    body {
      font-family: 'Be Vietnam Pro', 'Noto Sans TC', sans-serif;
      background-color: #fef8f1;
      color: #1d1b17;
      min-height: 100vh;
    }
    .font-display { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .receipt-divider { border-top: 1px dashed rgba(255, 255, 255, 0.35); }
    .receipt-divider-dark { border-top: 1px dashed rgba(115, 121, 113, 0.3); }

    .grain-texture {
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0);
      background-size: 8px 8px;
    }

    .squishy-btn:active {
      transform: scale(0.95);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* v4-named utilities missing from the v3 Play CDN */
    .backdrop-blur-xs { backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }

    /* ---- Minimal port of tailwindcss-animate (animate-in helpers) ---- */
    @keyframes enter {
      from {
        opacity: var(--tw-enter-opacity, 1);
        transform: translate3d(var(--tw-enter-translate-x, 0), var(--tw-enter-translate-y, 0), 0)
                   scale(var(--tw-enter-scale, 1));
      }
    }
    .animate-in {
      animation-name: enter;
      animation-duration: 0.2s;
      animation-fill-mode: both;
      --tw-enter-opacity: initial;
      --tw-enter-scale: initial;
      --tw-enter-translate-x: initial;
      --tw-enter-translate-y: initial;
    }
    .duration-150 { animation-duration: 0.15s; }
    .duration-200 { animation-duration: 0.2s; }
    .fade-in { --tw-enter-opacity: 0; }
    .zoom-in { --tw-enter-scale: 0.95; }
    .slide-in-from-bottom { --tw-enter-translate-y: 100%; }
    .slide-in-from-top { --tw-enter-translate-y: -0.75rem; }

    /* lucide icons inherit sizing from Tailwind w-/h- utility classes */
    [data-lucide], svg.lucide { stroke-width: 2; }
  </style>

  function formatCurrency(amount) {
    return new Intl.NumberFormat('zh-TW', {

    }).format(amount).replace('NT$', '$');
  }
  function formatNumber(amount) {
    return new Intl.NumberFormat('zh-TW').format(amount);

  function calculateSharedSummary(transactions, period, memberFilter, members) {
    members = members || [];
    let filtered = transactions.filter(t => t.type === 'expense' && (t.isShared || t.splitType === '共同'));
    if (memberFilter !== 'all' && memberFilter !== '所有人') {
      filtered = filtered.filter(t => t.payer === memberFilter);
    }
    let totalShared = 0;
    const memberPaidMap = {};
    members.forEach(m => { memberPaidMap[m.name] = 0; });
    filtered.forEach(t => {
      totalShared += t.amount;
      memberPaidMap[t.payer] = (memberPaidMap[t.payer] || 0) + t.amount;
    });
    const dadPaid = memberPaidMap['爸爸'] || 0;
    const momPaid = memberPaidMap['媽媽'] || 0;
    const memberBreakdown = members.map(m => {
      const paid = memberPaidMap[m.name] || 0;
      const percent = totalShared > 0 ? Math.round((paid / totalShared) * 100) : 0;
      return { name: m.name, paid, percent, color: m.color };
    });
    const totalDadMom = dadPaid + momPaid;
    let dadPercent = totalDadMom > 0 ? Math.round((dadPaid / totalDadMom) * 100) : 50;
    let momPercent = totalDadMom > 0 ? 100 - dadPercent : 50;
    const fairShareEach = totalShared / 2;
    const dadDiff = dadPaid - fairShareEach;
    let settlementText = '', payerName = '爸爸', payerOwesName = '媽媽', suggestedAmount = 0;
    if (dadDiff > 0) {
      suggestedAmount = Math.round(dadDiff); payerOwesName = '媽媽'; payerName = '爸爸';
      settlementText = '媽媽 應該支付給 爸爸';
    } else if (dadDiff < 0) {
      suggestedAmount = Math.round(Math.abs(dadDiff)); payerOwesName = '爸爸'; payerName = '媽媽';
      settlementText = '爸爸 應該支付給 媽媽';
    } else {
      suggestedAmount = 0; settlementText = '帳目平衡，無須結算';
    }
    return { totalShared, dadPaid, momPaid, dadPercent, momPercent, memberBreakdown, settlementText, payerName, payerOwesName, suggestedAmount };
  }

  /* ---- HTML-escape helper for user-entered text ---- */
  function esc(s) {

  /* =========================== CLOUD SYNC (Google Apps Script Web API) =========================== */
  // The Web App /exec URL is entered by the user in the Settings modal and cached here.
  const CONFIG = { API_URL: localStorage.getItem('household_api_url') || '' };
  let pushTimer = null;
  let suspendPush = false; // true while applying data pulled from the server (avoid echo push)

  function persistLocal() {
    localStorage.setItem('household_transactions_v1', JSON.stringify(state.transactions));
    localStorage.setItem('household_pending_v1', JSON.stringify(state.pendingPayments));
    localStorage.setItem('household_members_v1', JSON.stringify(state.members));
  }

  // Any state mutation calls persist() -> caches locally AND mirrors the full
  // dataset to the Google Sheet (debounced) so the sheet always matches the app.
  function persist() {
    persistLocal();
    if (!suspendPush) syncPush();
  }

  function syncPush() {
    if (!CONFIG.API_URL) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(() => {
      fetch(CONFIG.API_URL, {
        method: 'POST',
        // text/plain keeps this a CORS "simple request" (no preflight to Apps Script)
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'saveAll',
          members: state.members,
          transactions: state.transactions,
          pendingPayments: state.pendingPayments,
        }),
      })
        .then(r => r.json())
        .then(d => { if (!d || !d.ok) console.error('saveAll error', d); })
        .catch(e => { console.error('syncPush failed', e); showToast('⚠️ 雲端同步失敗（已存本機）'); });
    }, 600);
  }

  function syncPull(opts) {
    opts = opts || {};
    if (!CONFIG.API_URL) return;
    fetch(CONFIG.API_URL, { method: 'GET' })
      .then(r => r.json())
      .then(d => {
        if (!d || !Array.isArray(d.transactions)) throw new Error('bad payload');
        suspendPush = true;
        state.transactions = d.transactions;
        state.pendingPayments = Array.isArray(d.pendingPayments) ? d.pendingPayments : [];
        state.members = Array.isArray(d.members) && d.members.length ? d.members : state.members;
        persistLocal();
        suspendPush = false;
        render('all');
        if (opts.toast) showToast('✅ 已從 Google Sheet 載入最新資料');
      })
      .catch(e => {
        console.error('syncPull failed', e);
        if (opts.toast) showToast('⚠️ 無法連線雲端，改用本機資料');
      });
  }

  function showToast(msg) {
    state.toastMessage = msg;
    render('all');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { state.toastMessage = null; render('shell'); }, 3000);
  }

    if (splitType === '收入') return 'bg-[#ffe17a] text-[#231b00]';

      '<div class="w-full h-3 bg-[#f3ede6] rounded-full overflow-hidden shadow-inner">' +
      '<div class="h-full transition-all duration-500 ' + (budgetUsedPercent > 90 ? 'bg-red-500' : (budgetUsedPercent > 70 ? 'bg-[#be9c47]' : 'bg-[#4a654a]')) + '" style="width:' + budgetUsedPercent + '%"></div>' +

    html += '<div class="grid grid-cols-2 gap-3">' +

    html += '<div class="flex gap-3">' +
      '<button onclick="App.openAdd()" class="flex-1 py-3 bg-[#8ba889] hover:bg-[#4a654a] text-white rounded-2xl font-semibold text-sm transition-all active:scale-95 flex items-center justify-center gap-2 shadow-xs cursor-pointer">' +

    sortedCategories.slice(0, 4).forEach(entry => {

      '<button onclick="App.saveApiUrl()" class="flex-1 py-2 bg-[#4a654a] hover:bg-[#334d34] text-white rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition-all cursor-pointer">' +
      ic('link', 'w-3.5 h-3.5') + '<span>儲存並連線</span></button>' +
      '<button onclick="App.pullNow()" ' + (connected ? '' : 'disabled') + ' class="flex-1 py-2 ' + (connected ? 'bg-[#8ba889]/20 hover:bg-[#8ba889]/30 text-[#243d25]' : 'bg-[#ede7e0] text-[#a7aca3] cursor-not-allowed') + ' rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 transition-all cursor-pointer">' +
      ic('refresh-cw', 'w-3.5 h-3.5') + '<span>從雲端載入</span></button></div>' +
      (connected ? '<p class="text-[10px] text-[#737971] leading-relaxed">每次記帳/修改都會自動寫回這份 Google Sheet 🐾</p>' : '') +
      '</div>';

    // actions
    html += '<div class="space-y-2 pt-2 border-t border-[#f3ede6]">' +
      '<button onclick="App.exportData()" class="w-full py-2.5 bg-[#8ba889]/20 hover:bg-[#8ba889]/30 text-[#243d25] rounded-xl font-semibold text-xs flex items-center justify-center gap-2 transition-all cursor-pointer">' +
      ic('download', 'w-4 h-4') + '<span>匯出記帳與分帳數據 (JSON/CSV)</span></button>' +
      '<button onclick="App.confirmReset()" class="w-full py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl font-semibold text-xs flex items-center justify-center gap-2 transition-all cursor-pointer">' +
      ic('refresh-cw', 'w-4 h-4') + '<span>' + (s.resetConfirmed ? '確認恢復初次展示數據？' : '重設為範例初次數據') + '</span></button></div>';

    html += '</div></div>';
    return html;
  }

  /* ---------- Transaction detail modal ---------- */
  function renderItemModal() {
    if (!state.tv.activeItemId) return '';
    const item = state.transactions.find(t => t.id === state.tv.activeItemId);
    if (!item) return '';
    let html = '<div class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4">' +
      '<div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl border border-[#ede7e0] space-y-4 ' + (animateItem ? 'animate-in fade-in zoom-in duration-150' : '') + '">' +
      '<div class="flex justify-between items-start"><div>' +
      '<span class="text-xs text-[#737971]">帳務詳細資訊</span>' +
      '<h3 class="font-display font-bold text-xl text-[#1d1b17]">' + esc(item.title) + '</h3></div>' +
      '<button onclick="App.closeItem()" class="text-[#737971] hover:text-[#1d1b17] p-1">' + ic('x', 'w-5 h-5') + '</button></div>' +
      '<div class="bg-[#f9f3ec] p-4 rounded-2xl space-y-2 text-sm">' +
      '<div class="flex justify-between"><span class="text-[#737971]">金額</span><span class="font-bold text-lg text-[#4a654a]">$' + formatNumber(item.amount) + '</span></div>' +
      '<div class="flex justify-between"><span class="text-[#737971]">付款人</span><span class="font-semibold">' + esc(item.payer) + '</span></div>' +
      '<div class="flex justify-between"><span class="text-[#737971]">分類 / 分攤</span><span class="font-semibold">' + esc(item.category) + ' (' + esc(item.splitType) + ')</span></div>' +
      '<div class="flex justify-between"><span class="text-[#737971]">日期時間</span><span>' + esc(item.date) + ' ' + esc(item.time || '') + '</span></div>';
    if (item.note) {
      html += '<div class="pt-2 border-t border-[#ede7e0]"><span class="text-[#737971] text-xs block">備註</span><p class="text-xs text-[#1d1b17]">' + esc(item.note) + '</p></div>';
    }
    html += '</div><div class="flex gap-2 pt-2">' +
      '<button onclick="App.deleteFromModal(\'' + item.id + '\')" class="flex-1 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 cursor-pointer">' +
      ic('trash-2', 'w-4 h-4') + '<span>刪除此紀錄</span></button>' +
      '<button onclick="App.editFromModal(\'' + item.id + '\')" class="flex-1 py-2.5 bg-[#8ba889] hover:bg-[#4a654a] text-white rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5 cursor-pointer">' +
      ic('pencil', 'w-4 h-4') + '<span>編輯紀錄</span></button></div></div></div>';
    return html;
  }

  /* =========================== RENDER =========================== */
  /*
   * Layered rendering: the persistent background ("shell") and the modal
   * layer are updated independently. Interacting inside a modal only rebuilds
   * the modal layer, and each modal's entrance animation is played once (via
   * the animate* flags) instead of replaying on every keystroke/click — this
   * removes the flashing that a full-page innerHTML rebuild used to cause.
   */
  let animateAdd = false, animateSettings = false, animateItem = false, animateMemberForm = false;

  function renderShell() {
    let view = '';
    if (state.currentTab === 'settlement') view = renderSettlementView();
    else if (state.currentTab === 'transactions') view = renderTransactionsView();
    else if (state.currentTab === 'overview') view = renderOverviewView();

    let html = '';
    if (state.toastMessage) {
      html += '<div class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-[#1d1b17] text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg border border-white/20 animate-in fade-in slide-in-from-top duration-200">' + esc(state.toastMessage) + '</div>';
    }
    html += renderHeader();
    html += '<main class="min-h-[calc(100vh-120px)]">' + view + '</main>';
    html += renderBottomNav();
    return html;
  }

  function renderModals() {
    return renderAddModal() + renderSettingsModal() + renderItemModal();
  }

  function render(scope) {
    scope = scope || 'all';

    // capture focus
    const active = document.activeElement;
    let fid = null, fs = null, fe = null;
    if (active && active.id && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
      fid = active.id;
      try { fs = active.selectionStart; fe = active.selectionEnd; } catch (e) {}
    }

    if (scope === 'all' || scope === 'shell') {
      document.getElementById('shell').innerHTML = renderShell();
    }
    if (scope === 'all' || scope === 'modals') {
      document.getElementById('modals').innerHTML = renderModals();
    }

    if (window.lucide && window.lucide.createIcons) window.lucide.createIcons();

    // entrance animations only play on the render right after opening
    animateAdd = animateSettings = animateItem = animateMemberForm = false;

    // restore focus
    if (fid) {
      const el = document.getElementById(fid);
      if (el) {
        el.focus();
        if (fs != null) { try { el.setSelectionRange(fs, fe); } catch (e) {} }
      }
    }
  }

  /* =========================== HANDLERS =========================== */
  const App = {
    selectTab(tab) { state.currentTab = tab; render('shell'); },

    openAdd() {
      state.editingTransactionId = null;
      state.form = { type: 'expense', amount: '', title: '', payer: '爸爸', category: '飲食', splitType: '共同', date: '2026-05-24', time: '下午 02:30', note: '', isAdvance: false, owedBy: '' };
      state.isAddModalOpen = true;
      animateAdd = true;
      render('modals');
    },
    closeAdd() { state.isAddModalOpen = false; state.editingTransactionId = null; state.form = null; render('modals'); },

    openSettings() { state.isSettingsOpen = true; animateSettings = true; render('modals'); },
    closeSettings() {
      state.isSettingsOpen = false;
      state.settings.resetConfirmed = false;
      state.settings.isAddingMember = false;
      state.settings.editingId = null;
      render('modals');
    },

    // form field updates
    updateForm(key, val) { state.form[key] = val; /* no re-render: keep input smooth */ },
    setFormType(t) { state.form.type = t; render('modals'); },
    setFormPayer(p) {
      state.form.payer = p;
      // an advance payment can't be owed by the person who paid
      if (state.form.isAdvance && state.form.owedBy === p) {
        const other = state.members.find(m => m.name !== p);
        state.form.owedBy = other ? other.name : '';
      }
      render('modals');
    },
    setFormCategory(c) { state.form.category = c; render('modals'); },
    setFormSplit(s) { state.form.splitType = s; render('modals'); },
    toggleAdvance() {
      state.form.isAdvance = !state.form.isAdvance;
      if (state.form.isAdvance && (!state.form.owedBy || state.form.owedBy === state.form.payer)) {
        const other = state.members.find(m => m.name !== state.form.payer);
        state.form.owedBy = other ? other.name : '';
      }
      render('modals');
    },
    setOwedBy(name) { state.form.owedBy = name; render('modals'); },
    applyPreset(i) {
      const preset = PRESET_CHIPS[i];
      state.form.title = preset.label.replace(/ [^\s]+$/, '');
      state.form.category = preset.category;
      if (!state.form.amount) state.form.amount = String(preset.amount);
      render('modals');
    },

    submitForm(e) {
      e.preventDefault();
      const f = state.form;
      const numAmount = parseFloat(f.amount);
      if (isNaN(numAmount) || numAmount <= 0) return;
      const item = {
        title: (f.title || '').trim() || (f.type === 'income' ? '收入項目' : '支出項目'),
        amount: numAmount,
        type: f.type,
        payer: f.payer,
        category: f.type === 'income' ? '收入' : f.category,
        splitType: f.type === 'income' ? '收入' : f.splitType,
        date: f.date,
        time: f.time,
        note: f.note,
        isShared: f.splitType === '共同',
      };
      if (state.editingTransactionId) {
        const id = state.editingTransactionId;
        state.transactions = state.transactions.map(t => t.id === id ? Object.assign({}, item, { id: id }) : t);
        persist();
        state.editingTransactionId = null;
        state.isAddModalOpen = false; state.form = null;
        showToast('已更新帳務紀錄 🐾');
      } else {
        const newTx = Object.assign({}, item, { id: 't_' + Date.now() });
        state.transactions = [newTx].concat(state.transactions);

        // 代付：also create a pending payment that shows up in the settlement view
        let advanceCreated = false;
        if (f.type === 'expense' && f.isAdvance && f.owedBy && f.owedBy !== f.payer) {
          const pp = {
            id: 'p_' + Date.now(),
            title: f.payer + '代付：' + item.title,
            description: '應由 ' + f.owedBy + ' 償還',
            amount: numAmount,
            paidBy: f.payer,
            owedBy: f.owedBy,
            status: 'pending',
            date: f.date,
          };
          state.pendingPayments = [pp].concat(state.pendingPayments);
          advanceCreated = true;
        }

        persist();
        state.isAddModalOpen = false; state.form = null;
        showToast(advanceCreated ? '已新增帳務並建立代付款項 🐾' : '已新增一筆帳務紀錄 🐾');
      }
    },

    // settlement
    setPeriod(p) { state.sv.period = p; render('shell'); },
    setMemberFilter(m) { state.sv.memberFilter = m; render('shell'); },
    fetchAdvice() {
      state.sv.isLoadingAdvice = true; render('shell');
      setTimeout(() => {
        state.sv.catAdvice = CAT_ADVICE_POOL[Math.floor(Math.random() * CAT_ADVICE_POOL.length)];
        state.sv.isLoadingAdvice = false; render('shell');
      }, 900);
    },
    settlePending(id) {
      const target = state.pendingPayments.find(p => p.id === id);
      if (!target) return;
      state.pendingPayments = state.pendingPayments.map(p => p.id === id ? Object.assign({}, p, { status: 'settled' }) : p);
      const settledTx = {
        id: 't_settle_' + Date.now(),
        title: '代墊款已結清：' + target.title,
        amount: target.amount, type: 'expense', payer: target.owedBy,
        category: '其他', splitType: '個人',
        date: new Date().toISOString().split('T')[0], time: '剛才',
        note: '由 ' + target.owedBy + ' 支付給 ' + target.paidBy, isShared: false,
      };
      state.transactions = [settledTx].concat(state.transactions);
      persist();
      showToast('🎉 已成功結清代付款項 $' + target.amount + '！');
    },

    // transactions view
    setSearch(v) { state.tv.searchQuery = v; render('shell'); },
    setCategory(c) { state.tv.selectedCategory = c; render('shell'); },
    openItem(id) { state.tv.activeItemId = id; animateItem = true; render('modals'); },
    closeItem() { state.tv.activeItemId = null; render('modals'); },
    deleteFromModal(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      persist();
      state.tv.activeItemId = null;
      showToast('已刪除帳務紀錄 🐾');
    },
    editFromModal(id) {
      const tx = state.transactions.find(t => t.id === id);
      if (!tx) return;
      state.tv.activeItemId = null;
      state.editingTransactionId = tx.id;
      state.form = {
        type: tx.type, amount: String(tx.amount), title: tx.title, payer: tx.payer,
        category: tx.category, splitType: tx.splitType, date: tx.date, time: tx.time || '', note: tx.note || '',
        isAdvance: false, owedBy: '',
      };
      state.isAddModalOpen = true;
      animateAdd = true;
      render('modals');
    },

    // settings — members
    toggleAddMember() {
      state.settings.isAddingMember = !state.settings.isAddingMember;
      if (!state.settings.isAddingMember) state.settings.newMemberName = '';
      else animateMemberForm = true;
      render('modals');
    },
    setNewMemberName(v) { state.settings.newMemberName = v; },
    setNewMemberColor(c) { state.settings.newMemberColor = c; render('modals'); },
    addMember(e) {
      e.preventDefault();
      const name = state.settings.newMemberName.trim();
      if (!name) return;
      const newMember = { id: 'm_' + Date.now(), name: name, color: state.settings.newMemberColor };
      state.members = state.members.concat([newMember]);
      persist();
      state.settings.newMemberName = '';
      state.settings.isAddingMember = false;
      showToast('🎉 已成功新增家庭成員：' + name + '！');
    },
    startEditMember(id) {
      const m = state.members.find(x => x.id === id);
      if (!m) return;
      state.settings.editingId = m.id;
      state.settings.editingName = m.name;
      state.settings.editingColor = m.color;
      render('modals');
    },
    setEditName(v) { state.settings.editingName = v; },
    cancelEditMember() { state.settings.editingId = null; render('modals'); },
    saveEditMember(id) {
      const name = state.settings.editingName.trim();
      if (!name) return;
      state.members = state.members.map(m => m.id === id ? Object.assign({}, m, { name: name, color: state.settings.editingColor }) : m);
      persist();
      state.settings.editingId = null;
      showToast('已更新成員資訊 🐾');
    },
    deleteMember(id) {
      const target = state.members.find(m => m.id === id);
      state.members = state.members.filter(m => m.id !== id);
      persist();
      if (target) showToast('已移除成員：' + target.name);
      else render('all');
    },

    // settings — data
    confirmReset() {
      if (state.settings.resetConfirmed) {
        state.transactions = JSON.parse(JSON.stringify(INITIAL_TRANSACTIONS));
        state.pendingPayments = JSON.parse(JSON.stringify(INITIAL_PENDING_PAYMENTS));
        state.members = JSON.parse(JSON.stringify(INITIAL_MEMBERS));
        localStorage.removeItem('household_transactions_v1');
        localStorage.removeItem('household_pending_v1');
        localStorage.removeItem('household_members_v1');
        state.settings.resetConfirmed = false;
        state.isSettingsOpen = false;
        showToast('已重設為初次範例資料 🐾');
      } else {
        state.settings.resetConfirmed = true;
        render('modals');
      }
    },
    exportData() {
      const dataStr = JSON.stringify({ transactions: state.transactions, pendingPayments: state.pendingPayments, members: state.members }, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '家計簿數據_' + new Date().toISOString().split('T')[0] + '.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('已下載備份 JSON 檔案 🐾');
    },

    // cloud sync
    saveApiUrl() {
      const el = document.getElementById('api-url-input');
      const url = (el ? el.value : '').trim();
      CONFIG.API_URL = url;
      if (url) localStorage.setItem('household_api_url', url);
      else localStorage.removeItem('household_api_url');
      if (url) {
        showToast('已連線，正在載入雲端資料…');
        // the Google Sheet is the source of truth on connect: pull it down
        syncPull({ toast: true });
      } else {
        showToast('已中斷雲端連線（改用本機資料）');
      }
    },
    pullNow() {
      if (!CONFIG.API_URL) return;
      showToast('正在從雲端載入…');
      syncPull({ toast: true });
    },
  };

  window.App = App;

  // Add-to-Home-Screen: inject an icon + web manifest built from the cat avatar
  function installPwaMeta() {
    try {
      var apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.href = CAT_AVATAR;
      document.head.appendChild(apple);

      var manifest = {
        name: '家計簿',
        short_name: '家計簿',
        description: '費用結算與帳務明細',
        start_url: '.',
        scope: '.',
        display: 'standalone',
        background_color: '#fef8f1',
        theme_color: '#4a654a',
        icons: [
          { src: CAT_AVATAR, sizes: '128x128', type: 'image/jpeg', purpose: 'any' },
        ],
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    } catch (e) { console.error('installPwaMeta failed', e); }
  }

  function boot() {
    if (!window.lucide) { setTimeout(boot, 30); return; }
    installPwaMeta();
    document.getElementById('root').innerHTML =
      '<div class="min-h-screen bg-[#fef8f1] text-[#1d1b17] font-sans antialiased selection:bg-[#8ba889]/30">' +
        '<div id="shell"></div><div id="modals"></div>' +
      '</div>';
    render('all');
    // if a cloud API URL is configured, refresh from the Google Sheet
    if (CONFIG.API_URL) syncPull();
  }
  boot();
  </script>
</body>
